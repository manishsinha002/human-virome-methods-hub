site_name: Human Virome Methods Hub
site_description: Evidence-linked guidance for human viral metagenomics
site_url: https://virome-hub.github.io/human-virome-methods-hub/
repo_url: https://github.com/virome-hub/human-virome-methods-hub
repo_name: virome-hub/human-virome-methods-hub
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - content.code.copy
nav:
  - Home: index.md
  - Workflow: workflow.md
  - Sequencing strategies: strategies.md
  - Computational methods: methods.md
  - Suggest a tool: suggest-tool.md
  - Specimens: specimens.md
  - Decision guides: decision-guides.md
  - Evidence standards: evidence-standards.md
  - Benchmarks: benchmarks.md
  - Reporting checklist: reporting-checklist.md
  - Literature: literature.md
  - Contribute: contribute.md
  - Changelog: changelog.md
plugins:
  - search
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
